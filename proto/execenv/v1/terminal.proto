syntax = "proto3";

package execenv.v1;

option go_package = "github.com/sudosylabs/execenv/internal/gen/execenv/v1;execenvv1";

// TerminalService carries a grant's one terminal. An attachment lives as
// long as its Attach stream: ending the stream detaches, and the shell keeps
// running for the host's grace.
service TerminalService {
  // Attach answers with Attached, then output. A clean end of the stream is
  // the shell's exit; any other end is an error naming why.
  rpc Attach(AttachRequest) returns (stream AttachResponse);
  // Input carries keystrokes for one attachment. The first message names
  // it; the rest are bytes, written in order.
  rpc Input(stream InputRequest) returns (InputResponse);
  rpc Resize(ResizeRequest) returns (ResizeResponse);
  // Detach ends the attachment now, so the next Attach does not race the
  // host noticing the end of its stream. The shell keeps running.
  rpc Detach(DetachRequest) returns (DetachResponse);
  rpc Hangup(HangupRequest) returns (HangupResponse);
}

message DetachRequest {
  string attachment_id = 1;
}

message DetachResponse {}

message Window {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalPosition {
  string terminal_id = 1;
  uint64 offset = 2;
}

message AttachRequest {
  string grant_id = 1;
  string epoch = 2;
  Window window = 3;
  TerminalPosition resume = 4;
  bool takeover = 5;
}

message AttachResponse {
  oneof event {
    Attached attached = 1;
    Output output = 2;
  }
}

message Attached {
  // attachment_id names this attachment for Input, Resize and Hangup. It is
  // unguessable and known only to the client that attached.
  string attachment_id = 1;
  string terminal_id = 2;
  // start is the offset of the first output byte this attachment sends.
  uint64 start = 3;
}

message Output {
  uint64 offset = 1;
  bytes data = 2;
}

message InputRequest {
  oneof part {
    string attachment_id = 1;
    bytes data = 2;
  }
}

message InputResponse {}

message ResizeRequest {
  string attachment_id = 1;
  Window window = 2;
}

message ResizeResponse {}

message HangupRequest {
  string attachment_id = 1;
}

message HangupResponse {}
