syntax = "proto3";

package execenv.v1;

import "execenv/v1/common.proto";

option go_package = "github.com/sudosylabs/execenv/internal/gen/execenv/v1;execenvv1";

service PortService {
  rpc ConnectPort(stream PortFrame) returns (stream PortFrame);
  rpc ListPorts(ListPortsRequest) returns (ListeningPortsResponse);
}

// The client sends open first and waits for opened. Thereafter both peers
// send credit, data (at most 32 KiB per frame), or close_write. A
// sender must have sufficient byte credit before sending data. A
// terminal RPC error frame carries an ErrorDetail.
message PortFrame {
  oneof payload {
    PortOpen open = 1;
    bool opened = 2;
    bytes data = 3;
    bool close_write = 4;
    uint32 credit = 5;
  }
}

message PortOpen {
  // The host-facing call requires a fence. The guest link omits it.
  Fence fence = 1;
  int32 port = 2;
}

message ListPortsRequest {
  string id = 1;
  string epoch = 2;
}

message ListeningPortsResponse {
  repeated ListeningPort ports = 1;
}

message ListeningPort {
  int32 port = 1;
  string address = 2;
  string tag = 3;
}
