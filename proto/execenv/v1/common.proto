syntax = "proto3";

package execenv.v1;

option go_package = "github.com/sudosylabs/execenv/internal/gen/execenv/v1;execenvv1";

message Window {
  uint32 cols = 1;
  uint32 rows = 2;
}

enum Network {
  NETWORK_UNSPECIFIED = 0;
  NETWORK_NONE = 1;
  NETWORK_ALLOWLIST = 2;
}

// Fence names one incarnation of a grant and the newest control revision
// its caller has issued.
message Fence {
  string grant_id = 1;
  string epoch = 2;
  uint64 revision = 3;
}

message ContentReference {
  int64 size = 1;
  string sha256 = 2;
  string transfer_id = 3;
}

message Resources {
  int64 cpu_millis = 1;
  int64 memory_bytes = 2;
  int64 disk_bytes = 3;
}

// TokenBucket is a rate per second with a one-time burst. A zero rate is no
// limit.
message TokenBucket {
  int64 rate = 1;
  int64 burst = 2;
}

message Limits {
  TokenBucket disk_ops = 1;
  TokenBucket disk_bytes = 2;
  TokenBucket network_bytes = 3;
}

enum Resource {
  RESOURCE_UNSPECIFIED = 0;
  RESOURCE_CPU = 1;
  RESOURCE_MEMORY = 2;
  RESOURCE_DISK = 3;
}

// Shortfall is what a refused grant asked for and what was free.
message Shortfall {
  Resource resource = 1;
  int64 requested = 2;
  int64 free = 3;
}

// ErrorDetail rides on every error the host returns. sentinel names the
// execenv error, for example "conflict" or "capacity".
message ErrorDetail {
  string sentinel = 1;
  // feature is the missing feature of a refused Hello.
  string feature = 2;
  // shortfall explains a "capacity" refusal.
  Shortfall shortfall = 3;
  // missing_paths are the files a "missing_content" refusal names.
  repeated string missing_paths = 4;
}
