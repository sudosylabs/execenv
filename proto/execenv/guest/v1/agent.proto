syntax = "proto3";

package execenv.guest.v1;

import "execenv/v1/common.proto";
import "execenv/v1/file.proto";
import "execenv/v1/journal.proto";
import "execenv/v1/process.proto";
import "execenv/v1/process_log.proto";

option go_package = "github.com/sudosylabs/execenv/internal/gen/execenv/guest/v1;guestv1";

// AgentService is the guest helper, served on the per-grant guest link.
// It is internal: the host speaks it, no caller does, and it is versioned
// with the helper baked into each image.
service AgentService {
  // Hello says what this helper serves. The host refuses a helper on
  // another protocol, or without the journal or the process log.
  rpc Hello(HelloRequest) returns (HelloResponse);

  // Processes, by tag. The host keeps their history, grace and timeout;
  // the guest runs them inside the contained workload.
  rpc Spawn(SpawnRequest) returns (SpawnResponse);
  // Output streams every byte the process writes, each with its stream,
  // then its exit. It opens with an empty event as soon as the guest has
  // the process. The host opens it right after Spawn.
  rpc Output(OutputRequest) returns (stream OutputResponse);
  // Feed carries input for one process. The first message names it.
  rpc Feed(stream FeedRequest) returns (FeedResponse);
  rpc CloseFeed(ProcessRef) returns (Empty);
  rpc ResizeProcess(ResizeRequest) returns (Empty);
  rpc SignalProcess(SignalRequest) returns (Empty);

  // Freeze closes I/O before the host pauses the machine; Thaw reopens it.
  rpc Freeze(FreezeRequest) returns (FreezeResponse);
  rpc Thaw(ThawRequest) returns (ThawResponse);

  // ProcessEvents streams the workload's process log as it happens. The
  // helper holds a bounded queue while no stream is open.
  rpc ProcessEvents(ProcessEventsRequest) returns (stream ProcessEventsResponse);

  rpc UploadContent(stream execenv.v1.UploadContentRequest) returns (execenv.v1.ContentReference);
  rpc InitializeProjection(execenv.v1.InitializeProjectionRequest) returns (execenv.v1.ProjectionReceipt);
  rpc ApplyProjection(execenv.v1.ApplyProjectionRequest) returns (execenv.v1.ProjectionReceipt);
  rpc Observe(execenv.v1.ObserveRequest) returns (execenv.v1.ObservationPage);
  rpc ReadObservationContent(execenv.v1.ReadObservationContentRequest) returns (stream execenv.v1.ContentChunk);
  rpc ConfirmObservationProjection(execenv.v1.ConfirmObservationProjectionRequest) returns (execenv.v1.ConfirmObservationProjectionResponse);
  rpc AcknowledgeObservations(execenv.v1.AcknowledgeObservationsRequest) returns (execenv.v1.AcknowledgeObservationsResponse);

  // The plain file API over the workspace. The host checks grant and epoch;
  // changing calls still carry the fence the guest binds.
  rpc Stat(execenv.v1.StatRequest) returns (execenv.v1.FileInfo);
  rpc List(execenv.v1.ListRequest) returns (execenv.v1.ListResponse);
  rpc ReadFile(execenv.v1.ReadFileRequest) returns (stream execenv.v1.ContentChunk);
  rpc WriteFile(stream execenv.v1.WriteFileRequest) returns (execenv.v1.FileInfo);
  rpc MakeDirectory(execenv.v1.MakeDirectoryRequest) returns (execenv.v1.MakeDirectoryResponse);
  rpc Move(execenv.v1.MoveRequest) returns (execenv.v1.MoveResponse);
  rpc Remove(execenv.v1.RemoveRequest) returns (execenv.v1.RemoveResponse);
  rpc Import(stream execenv.v1.ImportRequest) returns (execenv.v1.ImportResponse);
  rpc Export(execenv.v1.ExportRequest) returns (stream execenv.v1.ContentChunk);
}

message Empty {}

message HelloRequest {}

message HelloResponse {
  uint32 protocol = 1;
  bool journal = 2;
  bool processes = 3;
}

message SpawnRequest {
  execenv.v1.ProcessSpec spec = 1;
}

message SpawnResponse {
  int32 pid = 1;
}

message ProcessRef {
  string tag = 1;
}

message OutputRequest {
  string tag = 1;
}

message OutputResponse {
  oneof event {
    Chunk data = 1;
    execenv.v1.ExitStatus exit = 2;
    Empty opened = 3;
  }
}

message Chunk {
  string stream = 1;
  bytes data = 2;
}

message FeedRequest {
  oneof part {
    string tag = 1;
    bytes data = 2;
  }
}

message FeedResponse {}

message ResizeRequest {
  string tag = 1;
  execenv.v1.Window window = 2;
}

message SignalRequest {
  string tag = 1;
  string signal = 2;
}

message FreezeRequest {}

message FreezeResponse {}

message ThawRequest {}

message ThawResponse {}

message ProcessEventsRequest {}

message ProcessEventsResponse {
  repeated execenv.v1.ProcessEvent events = 1;
}
